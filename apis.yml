aid: nirvana-tech
name: Nirvana Tech
description: >-
  Nirvana Insurance (Nirvana Tech, Inc.) is a technology-driven commercial
  trucking insurance provider that pairs A-rated fleet insurance coverage with
  an AI-powered active safety platform. Nirvana ingests telematics and
  connected-vehicle data from motor carriers to price risk more accurately, help
  fleets save up to 20% on premiums, and reduce accidents through real-time
  safety alerts, driver coaching, and predictive risk scoring. The company
  serves fleets and independent insurance agents through a digital quoting and
  policy-management agent portal, and is backed by General Catalyst. Nirvana
  raised a Series D round to expand its data-driven insurance and safety
  products across the trucking industry. As of this profile Nirvana operates a
  marketing site plus an agent sign-in portal and does not publish a public
  developer API, SDKs, or API documentation.
